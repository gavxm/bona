name: 'bona provenance check'
description: 'Investigate HuggingFace model provenance and flag license/lineage issues'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  models:
    description: 'Newline-separated list of HuggingFace model IDs to investigate'
    required: true
  fail-on-high:
    description: 'Fail the workflow if any HIGH severity finding is detected'
    required: false
    default: 'false'
  hf-token:
    description: 'HuggingFace API token for gated models'
    required: false
  version:
    description: 'bona version to install (ex. 0.3.0). Defaults to latest.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install bona
      shell: bash
      env:
        BONA_VERSION: ${{ inputs.version }}
      run: |
        if command -v bona &> /dev/null; then
          echo "bona already installed"
          exit 0
        fi

        # Determine version tag.
        if [ -n "$BONA_VERSION" ]; then
          TAG="v${BONA_VERSION}"
        else
          TAG=$(curl -s https://api.github.com/repos/gavxm/bona/releases/latest | jq -r '.tag_name')
        fi

        if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
          echo "::error::Could not determine bona version"
          exit 1
        fi

        # Determine platform.
        OS=$(uname -s)
        ARCH=$(uname -m)

        case "${OS}-${ARCH}" in
          Linux-x86_64)   TARGET="x86_64-unknown-linux-gnu" ;;
          Linux-aarch64)  TARGET="aarch64-unknown-linux-gnu" ;;
          Darwin-x86_64)  TARGET="x86_64-apple-darwin" ;;
          Darwin-arm64)   TARGET="aarch64-apple-darwin" ;;
          *)
            echo "::error::Unsupported platform: ${OS}-${ARCH}. Windows users: download from GitHub Releases."
            exit 1
            ;;
        esac

        # Download and extract binary.
        URL="https://github.com/gavxm/bona/releases/download/${TAG}/bona-${TARGET}.tar.xz"
        echo "Downloading bona ${TAG} for ${TARGET}..."
        curl -sfL "$URL" | tar xJ -C /usr/local/bin bona
        chmod +x /usr/local/bin/bona
        echo "bona $(bona --version) installed"

    - name: Run investigations
      shell: bash
      env:
        HF_TOKEN: ${{ inputs.hf-token }}
        BONA_MODELS: ${{ inputs.models }}
        BONA_FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
      run: bash ${{ github.action_path }}/summary.sh
