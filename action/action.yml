name: 'yurai provenance check'
description: 'Investigate HuggingFace model provenance and flag license/lineage issues'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  models:
    description: 'Newline-separated list of HuggingFace model IDs to investigate'
    required: true
  fail-on-high:
    description: 'Fail the workflow if any HIGH severity finding is detected'
    required: false
    default: 'false'
  upload-sarif:
    description: 'Upload SARIF results to GitHub code scanning'
    required: false
    default: 'false'
  hf-token:
    description: 'HuggingFace API token for gated models'
    required: false
  version:
    description: 'yurai version to install (ex. 0.3.0). Defaults to latest.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install yurai
      shell: bash
      env:
        YURAI_VERSION: ${{ inputs.version }}
      run: |
        if command -v yurai &> /dev/null; then
          echo "yurai already installed"
          exit 0
        fi

        # Determine version tag.
        if [ -n "$YURAI_VERSION" ]; then
          TAG="v${YURAI_VERSION}"
        else
          TAG=$(curl -s https://api.github.com/repos/gavxm/yurai/releases/latest | jq -r '.tag_name')
        fi

        if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
          echo "::error::Could not determine yurai version"
          exit 1
        fi

        # Determine platform.
        OS=$(uname -s)
        ARCH=$(uname -m)

        case "${OS}-${ARCH}" in
          Linux-x86_64)   TARGET="x86_64-unknown-linux-gnu" ;;
          Linux-aarch64)  TARGET="aarch64-unknown-linux-gnu" ;;
          Darwin-x86_64)  TARGET="x86_64-apple-darwin" ;;
          Darwin-arm64)   TARGET="aarch64-apple-darwin" ;;
          *)
            echo "::error::Unsupported platform: ${OS}-${ARCH}. Windows users: download from GitHub Releases."
            exit 1
            ;;
        esac

        # Download and extract binary.
        URL="https://github.com/gavxm/yurai/releases/download/${TAG}/yurai-${TARGET}.tar.xz"
        echo "Downloading yurai ${TAG} for ${TARGET}..."
        curl -sfL "$URL" | tar xJ -C /usr/local/bin yurai
        chmod +x /usr/local/bin/yurai
        echo "yurai $(yurai --version) installed"

    - name: Run investigations
      shell: bash
      env:
        HF_TOKEN: ${{ inputs.hf-token }}
        YURAI_MODELS: ${{ inputs.models }}
        YURAI_FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
        YURAI_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
      run: bash ${{ github.action_path }}/summary.sh

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/yurai.sarif
        category: yurai-provenance
