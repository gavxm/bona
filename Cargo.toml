[package]
name = "bona"
version = "0.2.0"
edition = "2024"
description = "Forensics-grade provenance explorer for AI models"
license = "AGPL-3.0-only"
repository = "https://github.com/gavxm/bona"
readme = "README.md"
keywords = ["ai-security", "provenance", "huggingface", "supply-chain", "mlsecops"]
categories = ["command-line-utilities"]

# Engine library.
[lib]
name = "bona"
path = "src/lib.rs"

# CLI.
[[bin]]
name = "bona"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4.44", features = ["serde"] }
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
indicatif = "0.18.4"
clap_complete = "4.6.5"

[dev-dependencies]
insta = { version = "1.47.2", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6.5"

[profile.dist]
inherits = "release"
lto = "thin"

