[package]
name = "yurai"
version = "0.4.0"
edition = "2024"
description = "Forensics-grade provenance explorer for AI models"
license = "AGPL-3.0-only"
repository = "https://github.com/gavxm/yurai"
readme = "README.md"
keywords = ["ai-security", "provenance", "huggingface", "supply-chain", "mlsecops"]
categories = ["command-line-utilities"]

# Engine library.
[lib]
name = "yurai"
path = "src/lib.rs"

# CLI.
[[bin]]
name = "yurai"
path = "src/main.rs"

# API server.
[[bin]]
name = "yurai-api"
path = "src/bin/yurai-api.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13", features = ["json"] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4.44", features = ["serde"] }
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
indicatif = "0.18.4"
clap_complete = "4.6.5"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
insta = { version = "1.47.2", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6.5"

[profile.dist]
inherits = "release"
lto = "thin"

